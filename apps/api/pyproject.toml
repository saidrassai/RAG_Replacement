[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-jit-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118.0",
  "jinja2>=3.1.0",
  "lattice-jit-connector-git-local",
  "lattice-jit-connector-pdf",
  "lattice-jit-contracts",
  "lattice-jit-core",
  "lattice-jit-governance",
  "lattice-jit-runtime",
  "lattice-jit-storage",
  "python-multipart>=0.0.20",
  "uvicorn>=0.37.0",
]

[project.scripts]
lattice-jit-api = "lattice_jit.apps.api.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lattice_jit*"]
namespaces = true

[tool.setuptools.package-data]
"lattice_jit.apps.api" = ["py.typed"]
