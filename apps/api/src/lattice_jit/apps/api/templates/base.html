<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattice-JIT v3.1 &mdash; Operator Console</title>
    <link rel="stylesheet" href="/static/css/review.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                         Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f0f5;
            color: #222;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ---- Header ---- */
        header {
            background-color: #1a1a2e;
            color: #eee;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        header nav {
            display: flex;
            gap: 1.5rem;
        }

        header nav a {
            color: #bbb;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.15s;
        }

        header nav a:hover {
            color: #fff;
        }

        /* ---- Main content ---- */
        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* ---- Card ---- */
        .card {
            background-color: #fff;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 1.5rem;
        }

        /* ---- Tables ---- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.6rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #f7f7fc;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #555;
        }

        th a {
            color: #555;
            text-decoration: none;
        }

        th a:hover {
            color: #1a1a2e;
        }

        tr:nth-child(even) {
            background-color: #fafafc;
        }

        tr:hover {
            background-color: #f0f0ff;
        }

        /* ---- Buttons ---- */
        .btn {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-approve {
            background-color: #2e7d32;
            color: #fff;
        }

        .btn-reject {
            background-color: #c62828;
            color: #fff;
        }

        .btn-filter {
            background-color: #1565c0;
            color: #fff;
        }

        .btn-secondary {
            background-color: #757575;
            color: #fff;
        }

        /* ---- Flash messages ---- */
        .flash-message {
            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-weight: 500;
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        /* ---- Forms ---- */
        .filter-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: flex-end;
            margin-bottom: 1.25rem;
        }

        .filter-form label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #555;
            display: block;
            margin-bottom: 0.2rem;
        }

        .filter-form select,
        .filter-form input {
            padding: 0.4rem 0.6rem;
            font-size: 0.9rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }

        .filter-form .field-group {
            display: flex;
            flex-direction: column;
        }

        /* ---- Pagination ---- */
        .pagination {
            margin-top: 1.25rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .pagination a {
            color: #1565c0;
            text-decoration: none;
            font-weight: 500;
        }

        .pagination a:hover {
            text-decoration: underline;
        }

        /* ---- Definition list ---- */
        dl {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 0.5rem 0;
        }

        dt {
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
            padding: 0.4rem 0;
        }

        dd {
            padding: 0.4rem 0;
            font-size: 0.95rem;
        }

        /* ---- Action bar ---- */
        .action-bar {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            align-items: center;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #1565c0;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #888;
            font-size: 1.1rem;
        }

        .reviewed-notice {
            font-style: italic;
            color: #888;
            margin-top: 0.5rem;
        }

        .sort-indicator {
            margin-left: 0.2rem;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Lattice-JIT v3.1 &mdash; Operator Console</h1>
        <nav>
            <a href="/ui/review-queue?tenant_id={{ tenant_id }}">Review Queue</a>
            <a href="/v1/audit-events">Audit Events</a>
        </nav>
    </header>
    <main>
        {% if message %}
        <div class="flash-message">{{ message }}</div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
