[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-jit-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery>=5.5.3",
  "lattice-jit-contracts",
  "lattice-jit-core",
  "lattice-jit-governance",
  "lattice-jit-runtime",
  "lattice-jit-storage",
]

[project.scripts]
lattice-jit-worker = "lattice_jit.apps.worker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lattice_jit*"]
namespaces = true

[tool.setuptools.package-data]
"lattice_jit.apps.worker" = ["py.typed"]
