[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-jit-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "lattice-jit-connector-git-local",
  "lattice-jit-contracts",
  "lattice-jit-core",
  "lattice-jit-governance",
  "lattice-jit-runtime",
  "lattice-jit-storage",
  "typer>=0.19.2",
]

[project.scripts]
ljit = "lattice_jit.apps.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lattice_jit*"]
namespaces = true

[tool.setuptools.package-data]
"lattice_jit.apps.cli" = ["py.typed"]
