[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-jit-contracts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lattice_jit*"]
namespaces = true

[tool.setuptools.package-data]
"lattice_jit.contracts" = ["py.typed"]
