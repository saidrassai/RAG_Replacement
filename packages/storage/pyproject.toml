[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-jit-storage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "lattice-jit-contracts",
  "lattice-jit-core",
  "psycopg[binary]>=3.2.11",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.43",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lattice_jit*"]
namespaces = true

[tool.setuptools.package-data]
"lattice_jit.storage" = ["py.typed"]
