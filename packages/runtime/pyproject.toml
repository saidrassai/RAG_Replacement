[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-jit-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery>=5.5.3",
  "lattice-jit-contracts",
  "lattice-jit-core",
  "lattice-jit-governance",
  "lattice-jit-lattice",
  "lattice-jit-model-proxy",
  "lattice-jit-policy",
  "lattice-jit-storage",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lattice_jit*"]
namespaces = true

[tool.setuptools.package-data]
"lattice_jit.runtime" = ["py.typed"]
