[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-jit-connector-confluence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "lattice-jit-contracts",
  "lattice-jit-core",
  "lattice-jit-storage",
  "requests>=2.31.0",
  "html2text>=2024.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lattice_jit*"]
namespaces = true

[tool.setuptools.package-data]
"lattice_jit.connectors.confluence" = ["py.typed"]
